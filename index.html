<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
        <title>Simple Interest Calculator</title>
    </head>
    <body>
        <main class="maindiv">
            <h1>Simple Interest Calculator</h1>
            <form id="calculator-form">
                <label for="principal">Amount</label>
                <input type="number" id="principal" min="0" step="any" required><br/>

                <label for="rate">Rate</label>
                <input type="range" id="rate" min="1" max="20" value="10.25" step="0.25">
                <span id="rate_val">10.25</span>% <br/>

                <label for="years">No. of Years</label>
                <input type="number" id="years" list="all_years" min="1" max="10" step="1" required>
                <datalist id="all_years">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </datalist>
                <br />
                Interest: <span id="result" aria-live="polite"></span><br/>

                <button type="submit">Compute Interest</button>
            </form>
        </main>

        <footer>
            &#169; This Calculator belongs to Ujjwal
        </footer>

        
    </body>
</html>
